[package]
name = "nspawn"
version = "0.2.0"
edition = "2021"
description = "Docker-like management of systemd-nspawn machines: OCI images from a hub, shared layers, systemd integration"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "8"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
nix = { version = "0.31", features = ["term", "user", "fs", "ioctl", "signal", "sched", "process", "poll"] }
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
toml = "1"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26100", features = ["machine1", "systemd1", "zbus-async-tokio"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
