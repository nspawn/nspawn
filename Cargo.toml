[package]
name = "nspawn"
version = "2.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Docker-like management of systemd-nspawn machines: OCI images from a hub, shared layers, systemd integration"
rust-version = "1.88"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "8"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
nix = { version = "0.31", features = [
    "term",
    "user",
    "fs",
    "dir",
    "ioctl",
    "signal",
    "sched",
    "process",
    "poll",
    "socket",
    "net",
    "uio",
    "time",
    "mount",
    "resource",
] }
oci-client = { version = "0.18", default-features = false, features = [
    "rustls-tls",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
    "process",
    "sync",
    "net",
    "signal",
] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
# The Docker API served to machines (nspawn api-serve): HTTP/1.1 over a unix socket.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
regex = "1"
# Grapheme clusters, by which docker's tables measure their cells.
unicode-segmentation = "1"
toml = "1"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26100", features = [
    "machine1",
    "systemd1",
    "zbus-async-tokio",
] }
zstd = "0.14"
# ADD of bzip2 and xz archives in Dockerfile builds; both decoders are Rust.
bzip2 = "0.6"
lzma-rs = "0.3"
# unstable-dynamic is required for the dynamic autocompletions
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
clap_mangen = "0.3"
sigstore-verify = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
# Clones and allocations the default set lets through.
assigning_clones = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
or_fun_call = "warn"
trivially_copy_pass_by_ref = "warn"
