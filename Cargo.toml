[package]
name = "nspawn"
version = "1.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Docker-like management of systemd-nspawn machines: OCI images from a hub, shared layers, systemd integration"
rust-version = "1.88"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "8"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
nix = { version = "0.31", features = ["term", "user", "fs", "dir", "ioctl", "signal", "sched", "process", "poll", "socket", "uio", "time", "mount"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "sync", "net", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
toml = "1"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26100", features = ["machine1", "systemd1", "zbus-async-tokio"] }
zstd = "0.14"
clap_complete = "4"
clap_mangen = "0.3"
sigstore-verify = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
# Clones and allocations the default set lets through.
assigning_clones = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
or_fun_call = "warn"
trivially_copy_pass_by_ref = "warn"
