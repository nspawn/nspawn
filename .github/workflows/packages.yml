name: packages

on:
  push:
    tags: ["*"]
  workflow_dispatch:

jobs:
  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
      options: --privileged
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build rpmdevtools cargo rust systemd-rpm-macros selinux-policy-devel bzip2 tar xz
      - uses: actions/checkout@v4
      - name: Sources
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Cargo.toml holds the version; the spec follows it.
          sed -i "s/^%global upstream_version .*/%global upstream_version ${version}/" packaging/fedora/nspawn.spec
          rpmdev-setuptree
          git archive --format=tar.gz --prefix="nspawn-${version}/" -o ~/rpmbuild/SOURCES/nspawn-${version}.tar.gz HEAD
          cargo vendor vendor > /dev/null
          tar cJf ~/rpmbuild/SOURCES/nspawn-${version}-vendor.tar.xz vendor
      - name: Build
        run: rpmbuild -ba packaging/fedora/nspawn.spec
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-rpms
          path: ~/rpmbuild/RPMS/*/*.rpm

  deb:
    name: Ubuntu 24.04 deb
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git build-essential debhelper curl ca-certificates
          # The package must run on the oldest supported host, so it is built there;
          # that distribution's rust (1.75) is older than this crate asks for (1.85).
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - name: Sources
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cargo vendor vendor > /dev/null
          mkdir -p .cargo
          printf '[source.crates-io]\nreplace-with = "vendored-sources"\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
          cp -r packaging/debian/debian .
          # Cargo.toml holds the version; the changelog's first entry follows it
          # (a pre-release like 1.0.0-beta.1 sorts as 1.0.0~beta.1 in Debian).
          sed -i "1s/^nspawn ([^)]*)/nspawn (${version/-/\~}-1)/" debian/changelog
      - name: Build
        # -d: cargo and rustc come from rustup here, not from the packages the
        # control file names for a distribution whose own rust is new enough.
        run: dpkg-buildpackage -us -uc -b -d
      - name: The binary on its own
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p /tmp/tarball/nspawn-${version}
          cp target/release/nspawn README.md LICENSE /tmp/tarball/nspawn-${version}/
          tar -czf /tmp/tarball/nspawn-${version}-x86_64-linux.tar.gz \
              -C /tmp/tarball nspawn-${version}
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-debs
          path: |
            ../*.deb
            /tmp/tarball/*.tar.gz

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git cargo sudo
      - uses: actions/checkout@v4
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Cargo.toml holds the version; pkgver follows it (a pre-release like
          # 1.0.0-beta.1 is 1.0.0beta1), and the tarball takes the name the recipe
          # gives what it downloads.
          pkgver=$(echo "${version}" | sed 's/-beta\./beta/')
          mkdir -p /tmp/pkg && git archive --format=tar.gz --prefix="nspawn-${version}/" -o "/tmp/pkg/nspawn-${pkgver}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD /tmp/pkg/ && chown -R builder /tmp/pkg
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" /tmp/pkg/PKGBUILD
          cd /tmp/pkg && sudo -u builder makepkg --noconfirm --skipchecksums
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: /tmp/pkg/*.pkg.tar.zst

  release:
    name: Attach everything to the release
    needs: [rpm, deb, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.rpm' -o -name '*.deb' \
              -o -name '*.pkg.tar.zst' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          # What nobody downloads from a release page.
          rm -f upload/*debuginfo* upload/*debugsource* upload/*-debug-*
          (cd upload && sha256sum * > SHA256SUMS)
          ls -l upload
          tag=${GITHUB_REF_NAME}
          case "$tag" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" upload/* --clobber
          else
              gh release create "$tag" upload/* --title "nspawn $tag" --generate-notes $pre
          fi
