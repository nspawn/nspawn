# needrestart, which apt runs after an upgrade, restarts the services that still run a
# binary it replaced. The units nspawn starts for a running machine belong to that run:
# a restarted health runner starts over at "starting" and a port proxy drops its IPv6
# connections. They take the new binary at the machine's next start.
$nrconf{override_rc}{qr(^nspawn-(health|proxy|drain|rm)-.+\.service$)} = 0;
$nrconf{override_rc}{qr(^nspawn-api@.+\.service$)} = 0;
# The machines, which needrestart restarts after an upgrade of systemd-nspawn.
$nrconf{override_rc}{qr(^systemd-nspawn@.+\.service$)} = 0;
