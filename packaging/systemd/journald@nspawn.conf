# The journald namespace nspawn's machines write their output to with
# --log-driver local, the default, apart from the system's journal. Read it with
# `nspawn logs NAME` or `journalctl --namespace=nspawn`. Override this in
# /etc/systemd/journald@nspawn.conf or a drop-in under
# /etc/systemd/journald@nspawn.conf.d/.

[Journal]
SystemMaxUse=1G
