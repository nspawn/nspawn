<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.nspawn"/>
    <allow send_destination="org.nspawn"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.nspawn" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.nspawn" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.nspawn" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.nspawn" send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="org.nspawn"/>
  </policy>
</busconfig>
