services:
  web:
    image: x
    environment:
      T01: '${SET}'
      T02: '$SET-x'
      T03: '${UNSET:-${SET:-no}}'
      T04: '${UNSET:-a}b}c}'
      T05: '${SET:-a}b}c}'
      T06: '${UNSET:-{}}'
      T07: '${UNSET:-{a}x}'
      T08: '$$SET $$$SET $$$$'
      T09: '${SET:+alt${SET}}'
      T10: '${EMPTY:+alt}|${EMPTY+alt}|${UNSET+alt}|${UNSET:+alt}'
      T11: '${EMPTY:-d}|${EMPTY-d}|${UNSET-d}'
      T12: '${SET?err}|${EMPTY?err}|${SET:?err}'
      T13: '$ $1 $} $- ${SET}$'
      T14: '${set}'
      T15: '${SET-x:-y}'
      T16: '${UNSET-x:-y}'
      T17: '${UNSET:-$}'
      T18: '${UNSET:-$$}'
      T19: '${UNSET:-${UNSET2:-${SET}}}'
      T20: '${UNSET:-a}${UNSET:-b}}'
      T22: '${SET}}'
      T23: '${UNSET:-x}}}'
      T24: '${SET:-${UNSETA}}'
      T25: '${UNSET:+${UNSETB}}'
      T26: '_${A_B}_'
      T27: '$SET_suffix'
      T28: '${SET:-a:-b}'
      T31: '${UNSET:-a}-${UNSET:-b}'
      T32: '${UNSET-}'
      T33: '${UNSET:+}'
      T34: '${UNSET:-${UNSETC}x}'
      T35: '${UNSET:-}}'
      T36: '${UNSET-a:?b}'
      T37: '${SET?-x}'
      T38: '${SET:?-x}'
      T39: '${UNSET:-${SET}}${UNSET:-{${SET}}}'
      T40: '${UNSET:-${UNSET:-${UNSET:-deep}}}}}'
      T41: '${UNSET:-a${SET}b}c${SET}'
      T42: '${UNSET:-}${SET:+x}}'
