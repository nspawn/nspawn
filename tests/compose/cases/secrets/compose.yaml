services:
  app:
    image: alpine
    secrets:
      - db_password
      - source: api_key
        target: /etc/api_key
    configs:
      - app_config
      - source: from_env
        target: /etc/from_env
secrets:
  db_password:
    file: ./db_password.txt
  api_key:
    environment: API_KEY
configs:
  app_config:
    content: |
      key=value
      other=1
  from_env:
    environment: CONFIG_VALUE
